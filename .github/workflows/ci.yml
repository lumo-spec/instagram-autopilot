# CI: lint, types, tests, workflow audit, privacy check, licences, secret scan. No secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit # block before the schedule is enabled (docs/EGRESS.md)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Install (locked, hashes verified by uv)
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts
      - name: Type check
        run: uv run --no-sync mypy
      - name: Tests (fast) with coverage floor
        run: uv run --no-sync pytest -m "not slow" --cov --cov-report=term --cov-fail-under=85
      - name: Dependency licences
        run: uv run --no-sync python scripts/check_licenses.py
      - name: Hashed requirement files match uv.lock
        run: |
          uv export --frozen --format requirements-txt --no-default-groups --no-emit-project --no-header -o /tmp/publish.txt
          uv export --frozen --format requirements-txt --no-default-groups --group renew --no-emit-project --no-header -o /tmp/renew.txt
          diff -u requirements-publish.txt /tmp/publish.txt
          diff -u requirements-renew.txt /tmp/renew.txt
      - name: Queued posts are valid
        run: uv run --no-sync python -m autopilot validate

  slow-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Restore the voice model (SHA-256 checked on every load)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: kokoro-f3ff3571791e39611d31c381e3a41a3af07b4987
      - run: uv sync --locked
      - name: Render, voice and reel tests
        run: uv run --no-sync pytest -m slow

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the commits of a pull request
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history: privacy and secret scans look at every commit
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install PyYAML (hashed)
        run: pip install --require-hashes --no-deps -r requirements-publish.txt
      - name: Workflow audit (pinning, permissions, secrets, schedules OFF)
        run: python scripts/audit_workflows.py
      - name: Privacy check (owner reference files never in git)
        run: python scripts/privacy_check.py
      - name: Secret scan (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  ci-ok:
    # The single required check for pull requests into main.
    if: always()
    needs: [test, slow-tests, security]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
