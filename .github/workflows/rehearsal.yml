# Full practice run: fake clock, real queue/rendering/gates/voice, fake Instagram. Never posts;
# no secrets, no environment. The report and samples are uploaded as a (public) artifact.
name: Rehearsal

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to simulate (1-28)
        type: string
        default: "14"

permissions: {}

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: kokoro-f3ff3571791e39611d31c381e3a41a3af07b4987
      - run: uv sync --locked --no-default-groups --group render
      - name: Rehearse
        env:
          DAYS: ${{ inputs.days }}
        run: |
          case "$DAYS" in ''|*[!0-9]*) echo "days must be a number"; exit 1;; esac
          [ "$DAYS" -ge 1 ] && [ "$DAYS" -le 28 ] || { echo "days must be 1-28"; exit 1; }
          uv run --no-sync python -m autopilot rehearse --days "$DAYS" --out rehearsal-output/run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-report
          path: rehearsal-output/run
          retention-days: 14
