[project]
name = "autopilot"
version = "0.1.0"
description = "Hands-off Instagram page autopilot (official Instagram API with Instagram Login)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Minimal runtime needed by the secret-holding jobs (publish / renew).
# Everything heavy lives in the "render" group so it can never be installed there.
dependencies = [
    "pyyaml>=6.0.2",
    "tzdata>=2024.1",
]

[dependency-groups]
renew = [
    "pynacl>=1.5.0",
]
render = [
    "pillow>=11.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12",
    "pyloudnorm>=0.1.1",
    "imageio-ffmpeg>=0.5.1",
    "av>=13.0",
    "pyspellchecker>=0.8.1",
    "rapidfuzz>=3.9",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "torch>=2.4",
    "transformers>=4.45",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
feeds = [
    "defusedxml>=0.7.1",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot"]

[tool.uv]
# Only use releases at least ~2 weeks old at the time dependencies were locked.
exclude-newer = "2026-10-04T00:00:00Z"
default-groups = ["dev", "render", "renew", "feeds"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "PL"]
# RUF001-3: typographic quotes, dashes and IPA are intentional. PLC0415: heavy imports are
# deliberately lazy (the publish job must never import render libraries). S311: content
# selection randomness is not security-relevant.
ignore = ["PLR0913", "PLR0917", "PLR2004", "S603", "S607", "PLR0911", "PLR0912", "RUF001", "RUF002", "RUF003", "PLC0415", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["autopilot"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["kokoro.*", "misaki.*", "torch.*", "soundfile.*", "pyloudnorm.*", "imageio_ffmpeg.*", "av.*", "spellchecker.*", "scipy.*", "nacl.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs TTS model / ffmpeg (render smoke tests)",
]

[tool.coverage.run]
source = ["autopilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
