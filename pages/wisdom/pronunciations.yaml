# How the narrator must say unusual words. Values are Kokoro/misaki phoneme strings
# (British English), applied as [word](/phonemes/) before synthesis.
# Check new entries by ear: python -m autopilot say wisdom "text with the word"
words:
  Epictetus: ɛpɪktˈiːtəs
  Aurelius: ɔːɹˈiːliəs
  Thoreau: θˈɔːɹəʊ
  Tzu: dzˈuː

# Words the spelling dictionary does not know but which should need no override
# (British spellings and archaic forms). Deliberately waived; confirm by ear during the
# sample review and move any that sound wrong into ``words`` above.
waived:
  - apologise
  - colour
  - colours
  - draught
  - favourite
  - harbour
  - honour
  - risest
