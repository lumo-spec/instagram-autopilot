      If someone you love
      has gone quiet,
      ask again.

      Then **really listen.**
    position: top
    focus: bottom
    brief:
      scene: "An autumn park bench. Rowan sits beside Wren and turns fully towards her, listening; she is starting to speak."
      characters: [rowan, wren]
