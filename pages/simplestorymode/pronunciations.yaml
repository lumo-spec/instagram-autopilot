# How the narrator must say unusual words. Values are Kokoro/misaki phoneme strings
# (British English), applied as [word](/phonemes/) before synthesis.
# Check new entries by ear in a reel preview: python -m autopilot preview simplestorymode <post-id>
words: {}

# Words the dictionary does not know but which should need no override (British spellings,
# character names). Confirm by ear during reel previews and move any that sound wrong into `words`.
waived:
  - apologise
  - behaviour
  - colour
  - favourite
  - honour
  - neighbour
  - realise
  - recognise
  - rowan
  - wren
